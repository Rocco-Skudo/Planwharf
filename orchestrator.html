<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Orchestrator</title>
  <script>
    try {
      var theme = localStorage.getItem('planwharf_theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme);
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="orch.js" defer></script>
</head>
<body class="orch-app">
  <div class="fx" aria-hidden="true"></div>
  <header class="orch-top">
    <a class="brand" href="/orchestrator.html"><span class="mark">O</span><span>Orchestrator</span></a>
    <p class="orch-lead-now" id="orch-lead-now">Lead: none yet</p>
    <div class="orch-top-actions">
      <span class="local">live</span>
      <button type="button" id="theme-toggle" class="secondary" aria-pressed="false">Light</button>
    </div>
  </header>
  <main class="orch-shell">
    <section class="orch-chat" aria-label="Talk to the orchestrator">
      <div class="orch-chat-head">
        <label for="orch-lead">Orchestrator model</label>
        <select id="orch-lead"><option value="">Choose orchestrator</option></select>
        <p class="muted" id="orch-ask-hint">This is a command chat. Change the lead any time. Flagship and default models can orchestrate. Cheap local models stay workers.</p>
      </div>
      <div id="orch-ask-thread" class="orch-chat-thread"></div>
      <form id="orch-ask-form" class="orch-composer">
        <label for="orch-ask-input" class="sr-only">Message the orchestrator</label>
        <textarea id="orch-ask-input" maxlength="2000" rows="3" placeholder="Command the orchestrator. Stop DummyCalculator. Start RaceEngineer. Skip grill. Switch to automatic. Use Grok 4.7 as orchestrator. How much quota is left?"></textarea>
        <div class="orch-composer-actions">
          <button type="submit" class="primary" id="orch-ask-submit">Send</button>
          <button type="button" class="secondary" id="orch-ask-stop" hidden>Stop</button>
        </div>
      </form>
    </section>
    <section class="orch-board" aria-label="Dashboard">
      <p class="dash-live" id="orch-live">Connecting… Provider usage loads here as a percentage.</p>
      <div id="orchestrator" class="monitor"></div>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
